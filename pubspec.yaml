name: sz_construction_management
description: SZ Construction Management System - Enterprise Flutter Desktop App
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.1.0
  firebase_remote_config: ^5.0.0
  
  # State Management
  provider: ^6.1.2
  
  # Local Database (Desktop-compatible)
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  
  # Charts
  fl_chart: ^0.68.0
  
  # Window Management (Desktop)
  window_manager: ^0.4.2
  
  # PDF & Excel Reports
  pdf: ^3.11.0
  printing: ^5.13.0
  excel: ^4.0.3
  
  # File Operations
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  open_file: ^3.3.2
  
  # Utils
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0
  
  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  
  # Icons & UI
  flutter_svg: ^2.0.10
  google_fonts: ^6.2.1
  
  # HTTP
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
